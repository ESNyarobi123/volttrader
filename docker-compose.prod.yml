# Volt Trades — production stack (Cassimu / VPS)
# Public entry: Caddy :80/:443 → web + api (Let's Encrypt)
# Infra (postgres/redis/minio) stays on the internal Docker network only.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build

name: volt-trades

services:
  caddy:
    image: caddy:2.8-alpine
    container_name: volt-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN:-mandandaspace.com}
      API_DOMAIN: ${API_DOMAIN:-api.mandandaspace.com}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - volt_caddy_data:/data
      - volt_caddy_config:/config
    depends_on:
      - web
      - api
      - minio

  postgres:
    image: postgres:16-alpine
    container_name: volt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-volt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-volt_trades}
    volumes:
      - volt_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-volt} -d ${POSTGRES_DB:-volt_trades}"]
      interval: 5s
      timeout: 5s
      retries: 15
    mem_limit: 384m

  redis:
    image: redis:7-alpine
    container_name: volt-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "96mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - volt_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 128m

  minio:
    image: minio/minio:latest
    container_name: volt-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
    volumes:
      - volt_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 256m

  minio-init:
    image: minio/mc:latest
    container_name: volt-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        i=0
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do
          i=$$((i+1))
          if [ "$$i" -gt 30 ]; then exit 1; fi
          sleep 1
        done
        mc mb -p local/$${S3_BUCKET:-volt-trades} || true
        mc anonymous set download local/$${S3_BUCKET:-volt-trades} || true
        echo "MinIO bucket ready"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET:-volt-trades}
    restart: "no"

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: volt-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      NODE_ENV: production
      API_PORT: 4000
      API_HOST: 0.0.0.0
      API_GLOBAL_PREFIX: api
      DATABASE_URL: postgresql://${POSTGRES_USER:-volt}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-volt_trades}?schema=public
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: ${CORS_ORIGINS:-https://mandandaspace.com,https://www.mandandaspace.com}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-900}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-1209600}
      BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS:-12}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET:-volt-trades}
      S3_FORCE_PATH_STYLE: "true"
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-https://mandandaspace.com/media/volt-trades}
      PAYMENT_DEFAULT_GATEWAY: ${PAYMENT_DEFAULT_GATEWAY:-manual}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:?set PAYMENT_WEBHOOK_SECRET}
      ALLOW_MOCK_PAYMENTS: ${ALLOW_MOCK_PAYMENTS:-false}
      FLUTTERWAVE_SECRET_KEY: ${FLUTTERWAVE_SECRET_KEY:-}
      FLUTTERWAVE_PUBLIC_KEY: ${FLUTTERWAVE_PUBLIC_KEY:-}
      FLUTTERWAVE_WEBHOOK_HASH: ${FLUTTERWAVE_WEBHOOK_HASH:-}
      FLUTTERWAVE_BASE_URL: ${FLUTTERWAVE_BASE_URL:-https://api.flutterwave.com}
      DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-TZS}
      MAIL_FROM: ${MAIL_FROM:-Volt Trades <no-reply@mandandaspace.com>}
      SMTP_URL: ${SMTP_URL:-}
      SITE_URL: ${SITE_URL:-https://mandandaspace.com}
      FEATURE_REAL_MONEY_INVESTMENTS: ${FEATURE_REAL_MONEY_INVESTMENTS:-false}
      SEED_ON_BOOT: ${SEED_ON_BOOT:-true}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s
    mem_limit: 512m

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.mandandaspace.com/api}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://mandandaspace.com}
        NEXT_PUBLIC_BRAND_NAME: ${NEXT_PUBLIC_BRAND_NAME:-Volt Trades}
        NEXT_PUBLIC_ALLOW_MOCK_PAYMENTS: ${NEXT_PUBLIC_ALLOW_MOCK_PAYMENTS:-false}
        NEXT_PUBLIC_S3_PUBLIC_URL: ${S3_PUBLIC_URL:-https://mandandaspace.com/media/volt-trades}
    container_name: volt-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      HOSTNAME: 0.0.0.0
    mem_limit: 384m

volumes:
  volt_postgres_data:
  volt_redis_data:
  volt_minio_data:
  volt_caddy_data:
  volt_caddy_config:
